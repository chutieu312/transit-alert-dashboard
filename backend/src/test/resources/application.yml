# Test configuration — overrides application.yml
# Flapdoodle embedded MongoDB is auto-configured when on the classpath.
spring:
  data:
    mongodb:
      # Let Flapdoodle pick the port; just set the db name
      database: transitdb-test

security:
  jwt:
    secret: test-secret-at-least-32-characters-long
    expiration-ms: 3600000
