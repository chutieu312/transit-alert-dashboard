services:
  mongodb:
    image: mongo:7
    container_name: transit-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: transitdb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: transit-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongodb:27017/transitdb
      JWT_SECRET: ${JWT_SECRET:-transit-demo-secret-change-in-prod-min-32-chars}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:8080/api
    container_name: transit-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

  mongo-express:
    image: mongo-express
    container_name: transit-mongo-express
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_PASS:-pass}
    ports:
      - "8081:8081"

volumes:
  mongo-data:
