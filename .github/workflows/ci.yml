name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend Tests ────────────────────────────────────────────────────────────
  # No service container needed — Testcontainers spins up a real MongoDB
  # container (mongo:7) inside the test process via @ServiceConnection.
  # Docker is available on ubuntu-latest by default.
  backend-ci:
    name: Backend (Java 21 / Maven)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run tests
        working-directory: backend
        env:
          # application.yml has a default for this, but explicit is better for CI
          JWT_SECRET: ci-test-secret-minimum-32-characters-long
        run: mvn --no-transfer-progress verify

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/

  # ── Frontend Tests ───────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend (Node 20 / Vite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npm run lint          # lint = tsc --noEmit in this project

      - name: Run unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build         # catches any bundler errors not caught by tsc

  # ── Docker Build & Push (main branch only) ───────────────────────────────────
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/transit-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/transit-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/transit-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/transit-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Staging (main branch only) ─────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://transit-api-staging.onrender.com

    steps:
      - name: Trigger Render staging deploy
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}")

          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 201 ]; then
            echo "✅ Render deploy triggered (HTTP $RESPONSE)"
          else
            echo "❌ Render deploy hook failed (HTTP $RESPONSE)"
            exit 1
          fi

      - name: Wait for staging health check
        run: |
          echo "Waiting for Render to finish deploying..."
          # Render free tier takes 60-90s on cold start — poll up to 3 minutes
          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://transit-api-staging.onrender.com/api/actuator/health)
            if [ "$STATUS" -eq 200 ]; then
              echo "✅ Staging health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i/18 — HTTP $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "❌ Staging did not become healthy after 3 minutes"
          exit 1
